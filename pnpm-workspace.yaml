# [20260816_Fix_SecurityAudit] pnpm 11 reads its config here (the package.json
# `pnpm` field is no longer consulted). allowBuilds.electron-winstaller carried
# an interactive-prompt placeholder ("set this to true or false") — now an
# explicit false: we build NSIS targets, never Squirrel installers. The
# overrides below force patched resolutions for transitive advisories whose
# patched versions already satisfy each consumer's declared semver range (the
# lockfile was merely stale). Scoped selectors must equal the consumer's
# declared range text verbatim (verified against each parent's package.json):
# e.g. eslint-plugin-react declares minimatch ^3.1.2, minimatch@10 declares
# brace-expansion ^5.0.5, docx declares nanoid ^5.1.3.
allowBuilds:
  "@tailwindcss/oxide": true
  electron: true
  electron-winstaller: false
  esbuild: true
  ffmpeg-static: true
onlyBuiltDependencies:
  - electron
overrides:
  # single-major-in-tree: bare pins
  # [20260816_Fix_SecurityAudit] shell-quote 1.8.5 / lodash 4.17.24 /
  # extract-zip 2.0.2 are named as patched in the advisories but were never
  # published (E404) — the real available patched versions are 1.10.0 and
  # 4.18.1. extract-zip has NO patched release at all (2.0.1 is latest); it is
  # a build-time-only dep of electron's installer, so that advisory stays open
  # upstream and is accepted as ignorable.
  shell-quote: 1.10.0
  lodash: 4.18.1
  ws: 8.21.0
  flatted: 3.4.2
  js-yaml: 4.3.1
  picomatch: 4.0.4
  postcss: 8.5.26
  # multi-major trees: scoped to the verbatim declared ranges
  brace-expansion@^1.1.7: 1.1.18
  brace-expansion@^2.0.1: 2.1.4
  brace-expansion@^2.0.2: 2.1.4
  brace-expansion@^5.0.5: 5.0.9
  minimatch@^3.1.2: 3.1.5
  nanoid@^3.3.17: 3.3.18
  nanoid@^5.1.3: 5.1.16
  hosted-git-info@^2.0.2: 2.8.9
  hosted-git-info@^2.1.4: 2.8.9
  semver@^5.5.0: 5.7.2
  "semver@2 || 3 || 4 || 5": 5.7.2
  # tsx (via vite) declares esbuild ~0.28.0; the dev-server advisory is
  # patched in 0.28.1. The top-level esbuild (^0.25.12, build:main) is a
  # different major and stays untouched.
  esbuild@~0.28.0: 0.28.1
  # license-checker's 2018-era normalize-package-data@2.0.0 pinned semver
  # '2 || 3 || 4'; 2.5.0 widened it to '2 || 3 || 4 || 5' so the semver
  # override above can reach it.
  normalize-package-data@2.0.0: 2.5.0
  # app-builder-lib 26.15.3 declares @electron/get ^3.0.0 but uses
  # ElectronDownloadCacheMode, which only exists from 3.1.0 — with 3.0.0 the
  # packaging crashes in resolveCacheMode ("reading 'ReadWrite'").
  "@electron/get@^3.0.0": 3.1.0
