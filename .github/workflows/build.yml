name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Rebuild native modules for system Node
        run: pnpm rebuild better-sqlite3

      - name: Build main bundle
        run: pnpm run build:main

      - name: Build preload bundle
        run: pnpm run build:preload

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Test with coverage
        run: pnpm test -- --coverage

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install

      # [20260816_Fix_MacCiNodeAbi] The old `npx electron-builder
      # install-app-deps` step silently no-opped on CI (~0.2s "finished"):
      # pnpm's onlyBuiltDependencies allowlist let better-sqlite3's own
      # install script download a system-Node prebuild (ABI 137), and the
      # unforced rebuild never replaced it — the shipped v1.3.0 macOS dmg
      # crashed at launch under Electron 39 (ABI 140). -f forces a real
      # Electron-ABI rebuild every time.
      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      # [20260816_Fix_MacCiNodeAbi] Gate: the native module must actually
      # open a database under the bundled Electron runtime before we are
      # allowed to package. ELECTRON_RUN_AS_NODE runs Electron's own Node
      # (ABI 140); a node-ABI binary exits non-zero here.
      - name: Verify native sqlite ABI under Electron (packaging gate)
        run: |
          ELECTRON_RUN_AS_NODE=1 npx electron -e "const D=require('better-sqlite3'); new D(':memory:').prepare('select 1 as ok').get(); console.log('native ABI gate passed')"
      # [20260816_Fix_MacCiNodeAbi] END
      - name: Prepare embedded Python
        run: pnpm run prepare:python:embedded

      - name: Build main bundle
        run: pnpm run build:main

      # [20260816_Fix_PackagedPreload] The build jobs never ran build:preload,
      # so every installer this workflow ever produced (v1.0.0 → v1.3.1) shipped
      # without dist-preload/preload.js — the packaged app boots, then the
      # renderer shows "Electron API 不可用 / preload 脚本加载失败" and no feature
      # works. main.ts loads the preload from app.getAppPath()/dist-preload.
      - name: Build preload bundle
        run: pnpm run build:preload

      # [20260816_Fix_PackagedPreload] Gate: refuse to package unless the
      # preload bundle exists (electron-builder's files glob silently skips
      # missing entries, which is how this shipped broken for so long).
      - name: Verify preload bundle exists (packaging gate)
        run: test -f dist-preload/preload.js
      # [20260816_Fix_PackagedPreload] END

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Build macOS DMG
        run: pnpm electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # [20260816_Gate_PackagedBootSmoke] Install the DMG we just built and
      # boot the real app. Asserts on the boot log: window created, startup
      # complete, and the renderer→preload→IPC bridge alive (hotkey
      # registration is sent BY the renderer, so it can only appear when the
      # preload works). This is the gate that would have caught both the
      # node-ABI sqlite binary (v1.3.0 mac) and the missing preload script
      # (all releases ≤ v1.3.1) — "build green" is not "artifact works".
      - name: Smoke test packaged app (boot + preload bridge)
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -quiet
          VOL=$(ls /Volumes | grep -i murmur | head -1)
          rm -rf /tmp/murmur-smoke && mkdir -p /tmp/murmur-smoke
          cp -R "/Volumes/$VOL/Murmur.app" /tmp/murmur-smoke/
          hdiutil detach "/Volumes/$VOL" -quiet || true
          rm -f "$HOME/Library/Application Support/Murmur/logs/app.log"
          /tmp/murmur-smoke/Murmur.app/Contents/MacOS/Murmur > /tmp/murmur-smoke/stdout.log 2>&1 &
          APP_PID=$!
          sleep 60
          LOG="$HOME/Library/Application Support/Murmur/logs/app.log"
          test -f "$LOG" || { echo "::error::app.log never appeared"; cat /tmp/murmur-smoke/stdout.log | tail -20; exit 1; }
          for milestone in "主窗口创建成功" "应用启动完成" "注册成功"; do
            grep -q "$milestone" "$LOG" || { echo "::error::boot milestone missing: $milestone"; tail -20 "$LOG"; exit 1; }
          done
          if grep -qE "NODE_MODULE_VERSION|Uncaught Exception|preload 脚本加载失败" "$LOG"; then
            echo "::error::fatal errors in packaged app boot log"
            grep -E "NODE_MODULE_VERSION|Uncaught Exception|preload" "$LOG" | head -5
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          sleep 3
          pkill -f "murmur-smoke/Murmur.app" 2>/dev/null || true
          echo "packaged app smoke passed: boot milestones + preload bridge verified"
      # [20260816_Gate_PackagedBootSmoke] END
      - name: Generate SHA256 checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip 2>/dev/null > checksums-sha256.txt || true
          cat checksums-sha256.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Murmur-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/checksums-sha256.txt

  build-win:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # [20260802_Fix_WinCiPnpmPostinstall] electron-builder's postinstall
      # (install-app-deps) detects pnpm via lockfile and forks pnpm.mjs,
      # which Windows cannot exec ("%1 is not a valid Win32 application").
      # Fix: (1) hoisted node_modules for flat layout, (2) --ignore-scripts
      # to skip the broken postinstall, (3) @electron/rebuild to rebuild
      # native modules for Electron ABI without calling pnpm.
      - name: Configure hoisted node_modules for Windows CI
        shell: bash
        run: echo "node-linker=hoisted" > .npmrc

      - name: Install dependencies (skip postinstall)
        run: pnpm install --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3
      # [20260802_Fix_WinCiPnpmPostinstall] END

      # [20260816_Fix_MacCiNodeAbi] Same ABI gate as build-mac: prove the
      # native sqlite module opens a database under the bundled Electron
      # before packaging, so a wrong-ABI binary can never reach an installer.
      # This job installs with --ignore-scripts, so electron's own postinstall
      # never extracted its binary — run it here first. The zip is already in
      # the @electron/get cache warmed by @electron/rebuild, so it only
      # extracts (no second download).
      - name: Verify native sqlite ABI under Electron (packaging gate)
        shell: bash
        run: |
          node node_modules/electron/install.js
          ELECTRON_RUN_AS_NODE=1 npx electron -e "const D=require('better-sqlite3'); new D(':memory:').prepare('select 1 as ok').get(); console.log('native ABI gate passed')"
      # [20260816_Fix_MacCiNodeAbi] END
      # [20260802_Fix_WinEmbeddedPython] prepare-embedded-python.js now
      # supports Windows (-pc-windows-msvc-shared). Keep continue-on-error
      # because torch/funasr pip install may exceed CI time/disk limits.
      - name: Prepare embedded Python
        run: pnpm run prepare:python:embedded
        continue-on-error: true

      - name: Build main bundle
        run: pnpm run build:main

      # [20260816_Fix_PackagedPreload] Same as build-mac: the preload bundle
      # must be built and present before packaging, or the installed app
      # shows "Electron API 不可用" and nothing works.
      - name: Build preload bundle
        run: pnpm run build:preload

      - name: Verify preload bundle exists (packaging gate)
        shell: bash
        run: test -f dist-preload/preload.js
      # [20260816_Fix_PackagedPreload] END

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Build Windows EXE
        run: pnpm electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # [20260816_Gate_PackagedBootSmoke] Windows counterpart of the mac
      # smoke: silently install the EXE we just built (/S, per-user install
      # to %LOCALAPPDATA%\Programs\murmur), launch it, and assert the same
      # boot-log milestones (window created, startup complete, renderer IPC
      # via hotkey registration) plus absence of fatal boot errors. Would
      # have caught the v1.2.0 file-uri-to-path crash (#157) before release.
      - name: Smoke test packaged installer (boot + preload bridge)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist -Filter "Murmur.Setup*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "installer exe not found in dist/" }
          Write-Host "Installing $installer silently"
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $appExe = Join-Path $env:LOCALAPPDATA 'Programs\murmur\Murmur.exe'
          if (-not (Test-Path $appExe)) { throw "installed app not found at $appExe" }
          $logDir = Join-Path $env:APPDATA 'Murmur\logs'
          Remove-Item (Join-Path $logDir 'app.log') -ErrorAction SilentlyContinue
          Start-Process -FilePath $appExe
          Start-Sleep -Seconds 90
          $log = Join-Path $logDir 'app.log'
          if (-not (Test-Path $log)) { throw "app.log not found at $log" }
          $content = Get-Content $log -Raw -Encoding UTF8
          foreach ($milestone in @('主窗口创建成功','应用启动完成','注册成功')) {
            if ($content -notlike "*$milestone*") { throw "boot milestone missing: $milestone" }
          }
          foreach ($fatal in @('NODE_MODULE_VERSION','Uncaught Exception','preload 脚本加载失败')) {
            if ($content -like "*$fatal*") { throw "fatal error in packaged boot log: $fatal" }
          }
          if (-not (Get-Process -Name 'Murmur' -ErrorAction SilentlyContinue)) { throw 'Murmur process is not running' }
          Stop-Process -Name 'Murmur' -Force -ErrorAction SilentlyContinue
          Write-Host 'packaged installer smoke passed: boot milestones + preload bridge verified'
      # [20260816_Gate_PackagedBootSmoke] END
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          $files = Get-ChildItem -Filter "*.exe" ; Get-ChildItem -Filter "*.zip"
          $hashes = foreach ($f in (Get-ChildItem -Include "*.exe","*.zip" -File)) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $hashes | Out-File -Encoding utf8 checksums-sha256.txt
          Get-Content checksums-sha256.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Murmur-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/checksums-sha256.txt

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Merge SHA256 checksums
        run: |
          cat Murmur-macOS/checksums-sha256.txt Murmur-Windows/checksums-sha256.txt > checksums-sha256.txt
          cat checksums-sha256.txt
          # Remove per-platform checksums to avoid filename collision during upload
          rm -f Murmur-macOS/checksums-sha256.txt Murmur-Windows/checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Murmur-macOS/*
            Murmur-Windows/*
            checksums-sha256.txt
          generate_release_notes: false
          body: |
            ## What's Changed

            See [CHANGELOG.md](https://github.com/TeFuirnever/Murmur/blob/main/CHANGELOG.md) for details.

            ## Installation

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `Murmur-*.dmg` |
            | Windows | `Murmur-Setup-*.exe` |

            **Verify download integrity**: compare your file's SHA256 with `checksums-sha256.txt`.

            **Prerequisites**: None for basic usage. Audio format conversion (mp3/ogg) is handled by the built-in Python environment.

            **First launch**: Murmur downloads the FunASR model (~1GB) on first run.

            **macOS**: If you see "cannot verify developer", right-click the app → "Open".
