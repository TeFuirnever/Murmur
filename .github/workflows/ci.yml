name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build main bundle
        run: pnpm run build:main

      - name: Build preload bundle
        run: pnpm run build:preload

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # [20260725_CodeReview_CiSync] Mirror scripts/ci-check.js stage 1:
      # typecheck:tests runs tsc against tsconfig.test.json which covers
      # tests/**. The local gate runs both; CI must too or the test type
      # safety gate is informational only. See ts-migration-audit-and-evolution.md §5.0 Tier 2.2.
      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: License compliance
        run: pnpm license:check

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Test with coverage
        run: pnpm test -- --coverage

      - name: Build renderer
        run: pnpm run build:renderer

      - name: E2E tests
        run: pnpm test:e2e
        continue-on-error: true
