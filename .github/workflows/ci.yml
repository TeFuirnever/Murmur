name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-test:
    # [20260817_T4_CiMatrix] Ticket #180 (spec #177 T4): dual-platform matrix.
    # Unit tests previously ran on macOS only, so Windows-only regressions
    # (taskkill vs signals, path separators, python.exe layout) never hit CI
    # until a release build. Known Windows-skipped suites already guard
    # themselves with it.skipIf(process.platform === "win32").
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # [20260817_T4_CiMatrix] Python supply for tests/python (stdlib
      # unittest + numpy). CI runners have no embedded env; the runner
      # script falls back to this system python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # [20260819_T10_CiDeps] numpy covers the DSP math; soundfile covers
      # the file-I/O tests (audio_preprocessing load/write) — CI runners
      # have no embedded env, and the local gate's embedded python hid this
      # gap until the matrix caught it (soundfile imports errored on CI).
      - name: Install Python test deps
        run: python -m pip install numpy soundfile

      - name: Install dependencies
        run: pnpm install

      - name: Build main bundle
        run: pnpm run build:main

      - name: Build preload bundle
        run: pnpm run build:preload

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # [20260725_CodeReview_CiSync] Mirror scripts/ci-check.js stage 1:
      # typecheck:tests runs tsc against tsconfig.test.json which covers
      # tests/**. The local gate runs both; CI must too or the test type
      # safety gate is informational only. See ts-migration-audit-and-evolution.md §5.0 Tier 2.2.
      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: License compliance
        run: pnpm license:check

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      # [20260905_Feat_NodeSqlite] The ABI-split rebuild is obsolete: sqlite
      # now comes from node:sqlite, built into both runtimes (spec #226).
      # Unit tests and e2e share the same install with nothing to flip.

      - name: Test with coverage
        # [20260905_Fix_CoverageForwarding] pnpm 11 forwards `--` literally;
        # use the script form so coverage actually runs.
        # [20260905_Fix_CoveragePlatformScope] thresholds are authored from
        # macOS actuals (see vitest.config.ts) and platform-conditional
        # branches (win32/darwin arms) make cross-platform percentages
        # non-comparable: the first honest Windows measurement landed at
        # 91.53% branch — win32 legs cover their own arms and miss the
        # darwin-only ones. Enforce the floor on the authoring platform;
        # Windows still runs the FULL suite, just without the threshold.
        if: runner.os == 'macOS'
        run: pnpm run test:coverage

      - name: Test (full suite; coverage floor is macOS-scoped)
        if: runner.os == 'Windows'
        run: pnpm run test

      # [20260817_T4_CiMatrix] Mirror of the local ci-check stage1 entry:
      # stdlib-unittest suite (protocol contract + numpy smoke) via the
      # platform-aware runner script.
      - name: Python unit tests
        run: pnpm run test:python:unit

      - name: Build renderer
        run: pnpm run build:renderer

      # [20260816_Refactor_RemoveEffects] The effects chunk isolation step was
      # removed with the visual-effects feature (ogl/motion deps deleted); it
      # mirrors the equally-removed ci-check.js stage3b.

      # [20260725_E2E_LaunchDiagnosis] Diagnostic step: launches ONLY the
      # Electron app with full stderr/stdout/console capture (see
      # tests/e2e/helpers/electron-launch.js attachDiagnosticListeners).
      # Grep "[e2e-launch]" in this step's output to find:
      #   - env snapshot (NODE_ENV, RUNNER_OS, CSC_IDENTITY_AUTO_DISCOVERY)
      #   - bundle existence check (dist-main/main.js etc.)
      #   - main process console.log/error
      #   - raw stdout/stderr (ELECTRON_ENABLE_LOGGING=1 forces Electron
      #     to emit GPU/code-signing/init errors here)
      #   - process exit code/signal
      #   - window event timing
      #
      # This step is non-blocking. Its purpose is to surface WHY every
      # e2e test times out at firstWindow() on CI macOS. See spec §7
      # Stage 0 "2026-07-25 update" for context.
      - name: E2E launch diagnosis (non-blocking)
        run: pnpm test:e2e:diag
        continue-on-error: true

      # [20260725_E2E_BootHealthGate] Gate 3 (boot health) — runs the new
      # 7-test boot smoke suite per e2e-functional-verification-strategy.md
      # §4.1 / §7 Stage 1.
      #
      # STATUS: NON-BLOCKING until validated on real macOS (architect
      # review condition). The suite was authored against spec but could
      # not be run in the dev sandbox (firstWindow 30s timeout — env-wide,
      # 01-lifecycle fails identically). KNOWN_RENDERER_NOISE allowlist
      # at tests/e2e/suites/00-boot-health.test.js:43-45 is unvalidated.
      #
      # PROMOTION PLAN:
      #   1. Watch this step on the next 2-3 PRs (capture real output).
      #   2. If green 3x consecutive, flip to blocking by removing
      #      continue-on-error below AND add `retries: 1` per architect
      #      recommendation (CI macOS firstWindow flakiness — see spec §7
      #      Stage 0 acceptance at line 518-519).
      #   3. Expand KNOWN_RENDERER_NOISE based on observed console output.
      - name: E2E boot health (non-blocking — pending validation)
        run: pnpm test:e2e:boot
        continue-on-error: true

      - name: E2E tests
        run: pnpm test:e2e
        continue-on-error: true
